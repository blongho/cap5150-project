# Paths are relative to the repository root.
data:
  raw_dir: data/raw
  malware_csv: real_malware_v1.csv
  benign_csv: real_legitimate_v1.csv
  processed_path: data/processed/real_device.parquet
  date_column: HighestModDate     # as in Sahin et al. (2025)
  min_year: 2008
  max_year: 2020

permissions:
  list_path: data/deprecated_permissions.csv
  aosp_dir: data/raw/aosp
  min_api: 21                     # API 21-34: matches the 10 deprecated permissions in Sabbah et al.
  max_api: 34
  categories: [deprecated, restricted]

split:
  train_end_year: 2013            # train on 2008-2013 (inclusive)
  test_years: [2014, 2015, 2016, 2017, 2018, 2019, 2020]

model:
  name: random_forest
  n_estimators: 200
  class_weight: balanced
  n_jobs: -1

# Second model for the full experiments; passed to build_model like `model`.
mlp:
  name: mlp
  hidden_size: 256                # units in each of the two hidden layers
  dropout: 0.3                    # dropout after each hidden layer
  epochs: 50                      # maximum training epochs
  lr: 1.0e-3                      # Adam learning rate
  patience: 5                     # stop after this many epochs without lower validation loss
  batch_size: 256                 # mini-batch size
  val_fraction: 0.1               # share of training data held out for early stopping

# Retraining defense: label a share of each test year and update the model on it.
retrain:
  budget_fraction: 0.05           # share of each test year labelled (stratified by class)
  mlp_finetune_epochs: 10         # MLP fine-tuning epochs on the cumulative budget
  mlp_finetune_lr: 1.0e-4         # Adam learning rate for MLP fine-tuning

# Hypothesis tests (H1-H3): one-sided paired Wilcoxon over seeds.
stats:
  metric: aut_f1                  # per-seed AUT column compared
  alpha: 0.05                     # significance level for the reported conclusion

experiment:
  seeds: [0, 1, 2, 3, 4]
  results_dir: results
  figures_dir: figures
  # Optional analyses (each defaults to false when absent).
  separate_masking: true          # add masked_deprecated and masked_restricted conditions
  timed_masking: true             # add timed_masking: zero each permission from its change year
  malware_share_10pct: true       # rerun core conditions with test years cut to the share below
  malware_share_target: 0.10      # malware share of each test year in the _10pct variant

# Replication check (make analysis): default RF, random stratified split, all 166 permissions.
replication:
  test_size: 0.2                  # held-out share of the random split
  seed: 42                        # split and RF seed
  reference_accuracy: 0.954       # Sabbah et al., RF, all 166 permissions, real device

# KS drift tests (make ks_tests): per-permission and RF-score tests, train vs each test year.
ks:
  alpha: 0.05                     # Benjamini-Hochberg false discovery rate
  seed: 0                         # seed of the RF whose scores are tested
