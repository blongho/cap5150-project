[project]
name = "drift"
version = "0.1.0"
description = "Robustness of permission-based Android malware detectors under permission deprecation (CAP5150)"
requires-python = ">=3.10,<3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
