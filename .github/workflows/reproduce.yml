name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache downloaded data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: data-${{ hashFiles('src/drift/sources.py', 'data/aosp_manifest_sha256.txt') }}
      - name: Reproduce (environment, data, experiments, verification, tests)
        run: make reproduce PYTHON=python
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/
            figures/
